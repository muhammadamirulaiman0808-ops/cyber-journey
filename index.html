<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0E1A25"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cyber Journey"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="A 90-day cybersecurity study tracker and career map for students: weekly timetable, lab and video links, news sources, and a resume builder that updates as you tick tasks."><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cyber Journey Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky slim header, 5 tabs (bottom bar on phones, top row on desktop), one hero ring on Today, everything else quiet. */
:root{
  --bg:#EBEFF2; --surface:#F7F9FA; --surface-2:#E1E7EC; --ink:#0E1A25; --ink-2:#4B5C6B; --line:#CBD4DC;
  --accent:#2548E0; --accent-ink:#FFFFFF; --accent-soft:#DDE4FF;
  --done:#17825A; --done-soft:#D5EFE3; --warn:#9A5B00; --warn-soft:#F8E8C9;
  --hero:#0E1A25; --hero-ink:#EAF0F5; --hero-dim:#9DB0C1; --hero-acc:#8CA8FF; --hero-line:#2A3B4D;
  --c1:#3D63F0; --c2:#0F9C8E; --c3:#C98200; --c4:#8A52D6; --c5:#2E9B50; --c6:#D4467A; --c7:#7B8A97;
  --paper:#FFFFFF; --paper-ink:#141B22; --paper-dim:#5A6672; --paper-line:#C9D0D6; --paper-new:#E7EDFF;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1118; --surface:#111B25; --surface-2:#18242F; --ink:#E6EDF3; --ink-2:#97A8B7; --line:#243342;
    --accent:#8CA8FF; --accent-ink:#0A1118; --accent-soft:#1B2A52;
    --done:#4BCB92; --done-soft:#12342A; --warn:#E8A93F; --warn-soft:#3A2D12;
    --hero:#15233A; --hero-line:#2A3E5E;
    --c1:#7C9AFF; --c2:#35C9B8; --c3:#E3A93A; --c4:#B488F0; --c5:#5BCB7A; --c6:#F27AA3; --c7:#9AA9B6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1118; --surface:#111B25; --surface-2:#18242F; --ink:#E6EDF3; --ink-2:#97A8B7; --line:#243342;
  --accent:#8CA8FF; --accent-ink:#0A1118; --accent-soft:#1B2A52;
  --done:#4BCB92; --done-soft:#12342A; --warn:#E8A93F; --warn-soft:#3A2D12;
  --hero:#15233A; --hero-line:#2A3E5E;
  --c1:#7C9AFF; --c2:#35C9B8; --c3:#E3A93A; --c4:#B488F0; --c5:#5BCB7A; --c6:#F27AA3; --c7:#9AA9B6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.wrap{max-width:940px;margin-inline:auto;padding-inline:16px}
.mono{font-family:var(--f-mono)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;flex:none;border-radius:50%;display:block}
.bt{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 20px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand span{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-2)}
.pbar{height:3px;background:var(--surface-2)}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;color:var(--ink-2);font:500 11px/1.2 var(--f-body);min-width:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:780px){
  nav.tabs{position:static;display:flex;gap:4px;background:none;border:0;border-bottom:1px solid var(--line);padding:0;max-width:940px;margin:0 auto}
  nav.tabs button{flex-direction:row;gap:8px;padding:12px 16px;border-radius:0;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button[aria-current="page"]{background:none;border-bottom-color:var(--accent)}
  .navwrap{padding-inline:16px;max-width:972px;margin-inline:auto}
}
main{padding-block:18px 110px;display:flex;flex-direction:column;gap:26px;min-width:0}
@media (min-width:780px){main{padding-block:22px 60px}}
section{min-width:0}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
h2{font:800 22px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h3{font:600 16px/1.3 var(--f-body)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.mut{color:var(--ink-2)}
.small{font-size:13px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero .eyebrow{color:var(--hero-dim)}
.hero h1{font:800 clamp(26px,6.5vw,38px)/1.05 var(--f-display);letter-spacing:-.02em;margin-block:6px 8px;text-wrap:balance}
.hero p{color:var(--hero-dim);max-width:46ch;font-size:14px}
.hstats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px}
.hstats div{min-width:64px}
.hstats b{display:block;font:500 20px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.hstats span{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--hero-dim)}
.ringbox{position:relative;width:132px;height:132px}
.ringsvg{width:100%;height:100%}
.rtrack{fill:none;stroke:var(--hero-line);stroke-width:9}
.rbar{fill:none;stroke:var(--hero-acc);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ringc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringc b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ringc span{font:500 10px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--hero-dim);max-width:92px}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:start}.ringbox{order:-1;width:112px;height:112px}}

/* checkbox, rows */
.chk{flex:none;width:30px;height:30px;border:2px solid var(--ink-2);border-radius:8px;display:grid;place-items:center;color:transparent;background:var(--surface);transition:background .12s,border-color .12s}
.chk svg{width:18px;height:18px}
.chk[aria-checked="true"]{background:var(--done);border-color:var(--done);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.task,.blk{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tb,.bb{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.ttl{font-weight:600;overflow-wrap:anywhere}
.task.done .ttl,.blk.done .ttl{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 11.5px/1.4 var(--f-mono);color:var(--ink-2)}
.meta .late{color:var(--warn);background:var(--warn-soft);padding:0 6px;border-radius:4px}
.meta .dn{color:var(--done)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font:500 11.5px/1.3 var(--f-mono);text-decoration:none;color:var(--ink);background:var(--bg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c1)}
.chip.k-vid i{background:var(--c6)}
.chip.k-doc i{background:var(--c3)}
details{font-size:13.5px}
summary{cursor:pointer;color:var(--accent);font-weight:500;padding-block:2px}
details p{margin-block:6px;color:var(--ink-2)}
.imp{display:flex;flex-direction:column;gap:3px;margin-top:4px;color:var(--ink-2)}
.imp li{padding-left:14px;position:relative}
.imp li::before{content:"+";position:absolute;left:0;color:var(--done);font-family:var(--f-mono)}
.blk{border-left:4px solid var(--sc,var(--c7))}
.btime{font:500 12px/1.4 var(--f-mono);color:var(--ink-2);width:86px;flex:none;padding-top:5px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sc);margin-right:7px}
@media (max-width:520px){.blk{flex-wrap:wrap}.btime{width:auto;order:3;padding-top:0;flex-basis:100%;margin-left:42px}.blk .bb{order:2}}

/* generic cards, buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;min-height:42px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:999px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font:500 12.5px/1.2 var(--f-body);background:var(--surface);min-height:34px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
.field textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* week strip */
.mrow{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin-bottom:3px}
.mrow span{font:500 10px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--line);padding-bottom:3px;overflow:hidden;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(13,1fr);gap:3px}
.wk{position:relative;height:62px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font:500 12px/1 var(--f-mono);font-variant-numeric:tabular-nums;border:2px solid transparent}
.wk i{position:absolute;left:0;right:0;bottom:0;background:var(--done);opacity:.55}
.wk b{position:relative;font-weight:500}
.wk.now{border-color:var(--accent)}
.wk[aria-pressed="true"]{border-color:var(--ink)}
.wk.now::after{content:"";position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.flow{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--line);margin-left:7px;padding-left:18px}
.mc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mc::before{content:"";position:absolute;left:-27px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink-2)}
.mc.cur::before{background:var(--accent);border-color:var(--accent)}
.mc.fin::before{background:var(--done);border-color:var(--done)}
.dels{display:flex;flex-direction:column;gap:5px;font-size:14px}
.dels li{display:flex;gap:8px;align-items:flex-start}
.dels li::before{content:"";flex:none;width:14px;height:14px;margin-top:4px;border:2px solid var(--ink-2);border-radius:4px}
.dels li.ok::before{background:var(--done);border-color:var(--done)}
.dels li.ok{color:var(--ink-2)}

/* timetable */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;min-height:52px}
.day b{font:600 15px/1 var(--f-body);letter-spacing:0;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day.today:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent)}
.hb{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.hb .bar{height:10px}
.hb .bar i{background:var(--sc)}
.hb em{font:500 11.5px/1 var(--f-mono);font-style:normal;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:420px){.hb{grid-template-columns:88px 1fr 48px}}

/* resume */
.rgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.rgrid{grid-template-columns:300px minmax(0,1fr);align-items:start}.rform{position:sticky;top:70px}}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:clamp(16px,4vw,32px);font:13px/1.45 var(--f-body);box-shadow:0 1px 0 rgba(0,0,0,.04),0 12px 30px -18px rgba(0,0,0,.35);min-width:0;overflow-wrap:anywhere}
.r-name{font:800 22px/1.1 var(--f-display);text-align:center;letter-spacing:.01em}
.r-head{text-align:center;color:var(--paper-dim);margin-top:3px}
.r-contact{text-align:center;font-size:12px;margin-top:4px;color:var(--paper-dim)}
.r-h{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;margin-top:14px;padding-bottom:3px;border-bottom:1px solid var(--paper-line)}
.r-sub{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-weight:600}
.r-sub span{font-weight:400;color:var(--paper-dim);white-space:nowrap}
.r-it{font-style:italic;color:var(--paper-dim)}
.paper p{margin-top:4px}
.paper ul{margin-top:3px;padding-left:16px;list-style:disc}
.paper li{margin-top:2px;padding-left:2px}
.paper .ph{color:#9AA4AD;border-bottom:1px dashed #B5BEC6}
.paper .new{background:var(--paper-new);border-radius:3px;box-shadow:-3px 0 0 var(--paper-new),3px 0 0 var(--paper-new)}
.chk-list{display:flex;flex-direction:column;gap:6px;font-size:14px}
.chk-list li{display:flex;gap:8px;align-items:flex-start}
.chk-list li::before{content:"";flex:none;width:14px;height:14px;margin-top:4px;border:2px solid var(--ink-2);border-radius:4px}
.chk-list li.ok::before{background:var(--done);border-color:var(--done)}
.chk-list li.ok{color:var(--ink-2)}
.log li{padding-block:8px;border-bottom:1px solid var(--line);font-size:13.5px}
.log li:last-child{border-bottom:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

@media print{
  body *{visibility:hidden}
  #paper,#paper *{visibility:visible}
  #paper{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;padding:0}
  .new{background:none!important;box-shadow:none!important}
}
.act{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
nav.tabs .lg{display:none}
@media (max-width:779px){nav.tabs button{font-size:10px;padding-inline:0}}
@media (min-width:780px){nav.tabs .lg{display:inline}nav.tabs .sm{display:none}}
/* career */
.tag{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--surface-2);font:500 11.5px/1.3 var(--f-body);color:var(--ink)}
.tag.my{background:var(--accent-soft);color:var(--accent)}
details.lv{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.lv.cur{border-color:var(--accent)}
.lvsum{list-style:none;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;color:var(--ink);cursor:pointer;min-height:56px}
.lvsum::-webkit-details-marker{display:none}
.lvn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font:600 15px/1 var(--f-mono)}
details.lv.cur .lvn{background:var(--accent);color:var(--accent-ink)}
details.lv.fin .lvn{background:var(--done);color:#fff}
.lvt{display:flex;flex-direction:column;min-width:0}
.lvt b{font:700 16px/1.2 var(--f-display)}
.lvt i{font:500 11.5px/1.4 var(--f-mono);font-style:normal;color:var(--ink-2)}
.lvp{font:500 13px/1 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.lvb{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.msrow{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.msrow span{padding-top:4px;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.pgrid{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;gap:10px}
.pcard.main{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:4px;font-size:14px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:baseline}
.steps li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font:500 11px/20px var(--f-mono);text-align:center}
/* news */
.nrow{display:flex;gap:6px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.nlink{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px;text-decoration:none;color:var(--ink)}
.nlink:hover .nt{color:var(--accent)}
.nt{font-weight:600;overflow-wrap:anywhere}
.nd{font-size:13.5px;color:var(--ink-2)}
.star{flex:none;width:48px;display:grid;place-items:center;color:var(--ink-2);border-radius:0 10px 10px 0}
.star svg{fill:none}
.star[aria-pressed="true"]{color:var(--warn)}
.star[aria-pressed="true"] svg{fill:currentColor}
/* toast */

#toast button{color:var(--bg);text-decoration:underline;font-weight:600;white-space:nowrap}

const FIELDS = [
  ['name','Full name','text'],['headline','Headline','text'],['location','Location','text'],['phone','Phone','tel'],['email','Email','email'],
  ['linkedin','LinkedIn URL','text'],['github','GitHub URL','text'],['thm','TryHackMe profile URL','text'],['psa','PortSwigger profile URL','text'],
  ['uni','University','text'],['degree','Degree','text'],['grad','Expected graduation','text'],['languages','Languages','text'],['target','Looking for','text']
];
function viewResume() {
  const P = S.profile, checks = resumeChecks(), ok = checks.filter(c => c[1]).length;
  const fields = FIELDS.map(f => '<div class="field"><label for="p_' + f[0] + '">' + f[1] + '</label><input id="p_' + f[0] + '" data-p="' + f[0] + '" type="' + f[2] + '" value="' + esc(P[f[0]]) + '" autocomplete="off"></div>').join('');
  const log = TASKS.filter(t => isDone(t.id) && impactCount(t)).sort((a, b) => S.done[b.id].localeCompare(S.done[a.id])).slice(0, 6)
    .map(t => '<li><b>' + esc(t.title) + '</b><br><span class="mut small mono">' + fmt(S.done[t.id]) + ' · added ' + impactCount(t) + (impactCount(t) > 1 ? ' items' : ' item') + '</span></li>').join('');
  const clubs = (S.clubs || []).map((c, i) => '<div class="act"><div class="grid2">' +
    '<div class="field"><label for="c_org_' + i + '">Club or organisation</label><input id="c_org_' + i + '" data-a="' + i + ':org" value="' + esc(c.org) + '" autocomplete="off"></div>' +
    '<div class="field"><label for="c_role_' + i + '">Your role</label><input id="c_role_' + i + '" data-a="' + i + ':role" value="' + esc(c.role) + '" autocomplete="off"></div>' +
    '<div class="field"><label for="c_dates_' + i + '">Dates</label><input id="c_dates_' + i + '" data-a="' + i + ':dates" value="' + esc(c.dates) + '" autocomplete="off"></div></div>' +
    '<div class="field"><label for="c_desc_' + i + '">What you did (one line per bullet)</label><textarea id="c_desc_' + i + '" data-a="' + i + ':desc">' + esc(c.desc) + '</textarea></div>' +
    '<div><button class="btn warn" type="button" data-delclub="' + i + '">Remove</button></div></div>').join('');
  const clubCard = '<div class="card"><h3>Activities and clubs</h3><p class="mut small" style="margin-top:4px">Clubs, committees, volunteering, CTF teams, hackathons, mentoring. They appear on the CV and in the downloads.</p><div class="list" style="margin-block:10px">' + clubs + '</div><button class="btn" type="button" data-addclub>Add activity or club</button></div>';
  const printBtn = STANDALONE ? '<button class="btn" type="button" data-print>Print or save as PDF</button>' : '';
  const dl = (DL || STANDALONE)
    ? '<button class="btn pri" type="button" data-dl="docx">Download Word (.docx)</button><button class="btn" type="button" data-dl="md">Markdown</button><button class="btn" type="button" data-dl="txt">Plain text</button><button class="btn" type="button" data-dl="html">HTML</button>'
    : '<span class="mut small">Downloads are not available in this view. Use Copy, or open the page in claude.ai.</span>';
  return '<section><div class="sh"><h2>Resume builder</h2><span class="mut small mono">' + ok + ' of ' + checks.length + ' ready</span></div>' +
    '<div class="row">' + dl + printBtn + '<button class="btn" type="button" data-copy>Copy text</button></div>' +
    '<p class="mut small" style="margin-top:8px">Need a PDF? Open the Word file and use Save as PDF. Blue highlights mark lines your checklist just added. They are not in the downloads.</p></section>' +
    '<div class="rgrid"><div class="rform" style="display:flex;flex-direction:column;gap:16px">' +
    '<div class="card"><h3>Before you send it</h3><ul class="chk-list" style="margin-top:8px">' + checks.map(c => '<li' + (c[1] ? ' class="ok"' : '') + '>' + esc(c[0]) + '</li>').join('') + '</ul></div>' +
    '<details class="card" open><summary>Your details</summary><div class="grid2" style="margin-top:10px">' + fields + '</div>' +
    '<div class="field" style="margin-top:10px"><label for="p_course">Coursework</label><textarea id="p_course" data-p="course">' + esc(P.course) + '</textarea></div>' +
    '<div class="field" style="margin-top:10px"><label for="s_summary">Summary override (leave empty for the automatic one)</label><textarea id="s_summary" data-s>' + esc(S.summary) + '</textarea></div>' +
    '<label class="toggle" style="margin-top:10px"><input type="checkbox" id="hiToggle"' + (S.hi ? ' checked' : '') + '> Highlight lines added by ticks</label></details>' +
    clubCard + '<div class="card"><h3>Recently added</h3><ul class="log" style="margin-top:6px">' + (log || '<li class="mut">Nothing yet. Tick a task in the checklist.</li>') + '</ul></div></div>' +
    '<div class="paper" id="paper">' + blocksToHtml(buildBlocks(true), S.hi) + '</div></div>';
}
function paintPaper() { const el = document.getElementById('paper'); if (el) el.innerHTML = blocksToHtml(buildBlocks(true), S.hi); }

/* ---------- RENDER & EVENTS ---------- */
const VIEWS = { today: viewToday, flow: viewFlow, tasks: viewTasks, week: viewWeek, resume: viewResume, career: viewCareer, news: viewNews };
function chrome() {
  const dn = dayNum(), p = pct(CORE);
  document.getElementById('daylabel').textContent = dn < 1 ? 'Starts ' + fmt(S.start) : dn > 90 ? 'Day ' + dn : 'Day ' + dn + ' / 90';
  document.getElementById('topbar').style.width = p + '%';
  document.querySelectorAll('nav.tabs button').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
}
function render() {
  const y = window.scrollY;
  document.getElementById('main').innerHTML = VIEWS[tab]();
  chrome();
  window.scrollTo(0, y);
}
function setTab(t, top) {
  if (!VIEWS[t]) return;
  tab = t; resetArm = false;
  try { if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t); } catch (e) {}
  render(); if (top !== false) window.scrollTo(0, 0);
}
let toastTimer;
function toast(msg, action, to) {
  const el = document.getElementById('toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button" data-tab="' + (to || 'resume') + '">' + esc(action) + '</button>' : '');
  el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3800);
}
function toggleTask(id) {
  const t = TASK[id], was = isDone(id), lv0 = curLevel().n;
  if (was) delete S.done[id]; else { S.done[id] = TODAY(); S.act[TODAY()] = 1; }
  save();
  const n = impactCount(t);
  const row = document.querySelector('#tlist .task[data-id="' + id + '"]');
  if (tab === 'tasks' && row && !hideDone) {
    const open = row.querySelector('details') && row.querySelector('details').open;
    row.outerHTML = taskRow(t, true);
    if (open) document.querySelector('#tlist .task[data-id="' + id + '"] details').open = true;
    const all = TASKS.filter(x => filt === 'all' || String(monthOf(x.w)) === filt);
    document.getElementById('tsum').textContent = tsum(all);
    chrome();
  } else render();
  const lvNow = curLevel();
  if (!was && lvNow.n > lv0) toast('Level up! Level ' + lvNow.n + ': ' + lvNow.name, 'View career', 'career');
  else if (n) toast((was ? 'Removed from your CV: ' : 'Added to your CV: ') + n + (n > 1 ? ' items' : ' item'), was ? '' : 'View CV');
}
function toggleMs(id) {
  const lv0 = curLevel().n, was = !!S.ms[id];
  if (was) delete S.ms[id]; else { S.ms[id] = TODAY(); S.act[TODAY()] = 1; }
  save(); render();
  const L = curLevel();
  if (!was && L.n > lv0) toast('Level up! Level ' + L.n + ': ' + L.name);
}
function toggleBlock(k) {
  if (S.tt[k]) delete S.tt[k]; else { S.tt[k] = 1; S.act[TODAY()] = 1; }
  save(); render();
}
function slug() { return (S.profile.name || 'CV').trim().replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'CV'; }
async function saveFile(name, data) {
  if (!DL && STANDALONE) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Saved ' + name); return;
  }
  if (!DL) { toast('Downloads are not available here. Use Copy instead.'); return; }
  try { await DL.save({ filename: name, data }); toast('Saved ' + name); }
  catch (e) { if (e && e.code === 'declined') return; toast('Could not save that file. Try another format or Copy.'); }
}
async function doDownload(kind) {
  const blocks = buildBlocks(false), base = slug() + '-Cybersecurity-CV';
  try {
    if (kind === 'docx') await saveFile(base + '.docx', await makeDocx(blocks));
    else if (kind === 'md') await saveFile(base + '.md', blocksToMd(blocks));
    else if (kind === 'txt') await saveFile(base + '.txt', blocksToTxt(blocks));
    else if (kind === 'html') await saveFile(base + '.html', blocksToHtmlFile(blocks, S.profile.name + ' CV'));
  } catch (e) { toast(e && e.message ? e.message : 'Could not build that file.'); }
}
async function doCopy() {
  const text = blocksToTxt(buildBlocks(false));
  try { await navigator.clipboard.writeText(text); toast('Resume text copied'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); toast(ok ? 'Resume text copied' : 'Copy was blocked. Download the text file instead.');
}
function setMsg(m) { fileMsg = m; const el = document.getElementById('fileMsg'); if (el) el.textContent = m; }
function applyTheme() {
  const r = document.documentElement;
  if (S.theme) r.setAttribute('data-theme', S.theme); else r.removeAttribute('data-theme');
}
function toggleTheme() {
  const dark = S.theme ? S.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; save(); applyTheme();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-chk],[data-blk],[data-week],[data-filter],[data-day],[data-dl],[data-copy],[data-backup],[data-reset],[data-addclub],[data-delclub],[data-print],[data-ms],[data-path],[data-fav],[data-ncat]');
  if (!t) return;
  const d = t.dataset;
  if (d.tab) setTab(d.tab);
  else if (d.chk) toggleTask(d.chk);
  else if (d.blk) toggleBlock(d.blk);
  else if (d.week) { selWeek = +d.week; render(); }
  else if (d.filter) { filt = d.filter; render(); }
  else if (d.day) { selDay = +d.day; render(); }
  else if ('print' in d) { try { window.print(); } catch (err) {} }
  else if (d.ms) toggleMs(d.ms);
  else if (d.path) { S.path = S.path === d.path ? '' : d.path; save(); render(); }
  else if (d.fav) { if (S.fav[d.fav]) delete S.fav[d.fav]; else S.fav[d.fav] = 1; save(); render(); }
  else if (d.ncat) { newsCat = d.ncat; render(); }
  else if ('addclub' in d) { S.clubs.push({org: '', role: '', dates: '', desc: ''}); save(); render(); }
  else if (d.delclub) { S.clubs.splice(+d.delclub, 1); save(); render(); }
  else if (d.dl) doDownload(d.dl);
  else if ('copy' in d) doCopy();
  else if ('backup' in d) saveFile('cyber-journey-progress.json', JSON.stringify(S, null, 2));
  else if ('reset' in d) {
    if (!resetArm) { resetArm = true; render(); setTimeout(() => { if (resetArm) { resetArm = false; if (tab === 'today') render(); } }, 4000); }
    else { const keep = S.profile, keepC = S.clubs, kp = S.path, ke = S.explore, kf = S.fav; S = defaults(); S.profile = keep; S.clubs = keepC; S.path = kp; S.explore = ke; S.fav = kf; resetArm = false; save(); render(); toast('Progress reset. Your CV details were kept.'); }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.p) { S.profile[el.dataset.p] = el.value; save(); paintPaper(); }
  else if (el.dataset && 's' in el.dataset) { S.summary = el.value; save(); paintPaper(); }
  else if (el.id === 'newsQ') { newsQ = el.value; const l = document.getElementById('nlist'); if (l) l.innerHTML = newsList(); }
  else if (el.dataset && el.dataset.a) { const p = el.dataset.a.split(':'); if (S.clubs[+p[0]]) { S.clubs[+p[0]][p[1]] = el.value; save(); paintPaper(); } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'hideDone') { hideDone = el.checked; render(); }
  else if (el.dataset && el.dataset.explore) {
    const i = S.explore.indexOf(el.dataset.explore);
    if (el.checked && i < 0) S.explore.push(el.dataset.explore);
    if (!el.checked && i >= 0) S.explore.splice(i, 1);
    save(); render();
  }
  else if (el.id === 'hiToggle') { S.hi = el.checked; save(); paintPaper(); }
  else if (el.id === 'startDate' && /^\d{4}-\d{2}-\d{2}$/.test(el.value)) { S.start = el.value; selWeek = null; save(); render(); }
  else if (el.id === 'restoreFile' && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const j = JSON.parse(String(fr.result));
        if (!j || typeof j !== 'object' || typeof j.done !== 'object') throw new Error('bad');
        S = normalize(Object.assign(defaults(), j, { profile: Object.assign(defaults().profile, j.profile || {}) }));
        save(); applyTheme(); render(); toast('Backup restored');
      } catch (err) { setMsg('That file is not a Cyber Journey backup.'); }
    };
    fr.readAsText(el.files[0]);
  }
});
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.addEventListener('toggle', e => {
  const t = e.target;
  if (t && t.dataset && t.dataset.lv) {
    if (!openLv) openLv = new Set([curLevel().n]);
    const n = +t.dataset.lv;
    if (t.open) openLv.add(n); else openLv.delete(n);
  }
}, true);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== tab) setTab(h); });

try{if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}}catch(e){}
applyTheme();
(function init() {
  const h = location.hash.slice(1);
  if (VIEWS[h]) tab = h;
  render();
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(d => { DL = d; if (DL && (tab === 'resume')) render(); }).catch(() => {});
    }
  } catch (e) {}
})();
window.CJ = {
  VIEWS, TASKS, TASK, WEEK, SUBJ, hrs, blockRow, render, toast, esc, fmt, fmtLong, save,
  TODAY, addDays, daysBetween, dayNum, curWeek, isDone, sumH, setTab,
  get S() { return S; }, get tab() { return tab; },
  get selDay() { return selDay; }, set selDay(v) { selDay = v; }
};
})();
</script>
<script src="catchup.js"></script>
</body></html>
